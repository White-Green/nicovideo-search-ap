[tools]
node = "24"
pnpm = "11"
ruby = "4.0"
rust = "stable"

[env]
PROJECT_NAME = "nicovideo-search-ap"
SITE_URL = "nicovideo-search-ap.white-green.net"

[tasks.deploy]
env = {
  REPO_ROOT = "{{config_root}}",
  WORKER_BUILD_ROOT = "{{env.HOME}}/.nicovideo-search-ap/cargo-install/worker-build",
  _.path = "{{env.HOME}}/.nicovideo-search-ap/cargo-install/worker-build/bin",
}
run = """
#!/usr/bin/env bash
set -euo pipefail

WORKER_BUILD_VERSION="$(
  cargo metadata --manifest-path "$REPO_ROOT/fblog_system/Cargo.toml" --no-deps --format-version 1 \
    | jq -er '.metadata["cargo-binaries"]["worker-build"]'
)"
cargo install --locked "worker-build@${WORKER_BUILD_VERSION}" --root "$WORKER_BUILD_ROOT"

bundle install

ruby ./entry.rb
cf_account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
cf_api_token="${CLOUDFLARE_API_TOKEN:-}"

if [ -z "$cf_account_id" ] && [ -n "${CREDENTIALS_DIRECTORY:-}" ] && [ -r "${CREDENTIALS_DIRECTORY}/cloudflare_account_id" ]; then
  cf_account_id="$(tr -d '\r\n' < "${CREDENTIALS_DIRECTORY}/cloudflare_account_id")"
fi

if [ -z "$cf_api_token" ] && [ -n "${CREDENTIALS_DIRECTORY:-}" ] && [ -r "${CREDENTIALS_DIRECTORY}/cloudflare_api_token" ]; then
  cf_api_token="$(tr -d '\r\n' < "${CREDENTIALS_DIRECTORY}/cloudflare_api_token")"
fi

if [ -z "$cf_account_id" ] || [ -z "$cf_api_token" ]; then
  echo "ERROR: Cloudflare credentials are missing." >&2
  echo "Set CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN or provide systemd credentials." >&2
  exit 1
fi

CLOUDFLARE_ACCOUNT_ID="$cf_account_id" CLOUDFLARE_API_TOKEN="$cf_api_token" ./fblog_system/deploy_scripts/cloudflare/deploy_prod.sh \
    "$(pwd)/dist/system/articles" \
    "$(pwd)/dist/system/users" \
    "$(pwd)/dist/public" \
    "${PROJECT_NAME}" \
    "${SITE_URL}" \
    "$(pwd)/publickey.pem"
"""
